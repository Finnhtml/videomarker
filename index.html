<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Marker Pro Monitor Ultra</title>
    <style>
        :root {
            --bg: #000000;
            --card: rgba(28, 28, 30, 0.9);
            --accent: #32d74b;
            --text: #ffffff;
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body, html { 
            height: 100%; margin: 0; padding: 0; 
            background-color: var(--bg); color: var(--text);
            font-family: -apple-system, sans-serif; overflow: hidden;
        }

        /* Kamera-Hintergrund */
        #video-bg {
            position: fixed; inset: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: 1; display: none; background: #111;
        }

        /* Content Layer */
        .app-layer {
            position: relative; z-index: 10;
            height: 100%; display: flex; flex-direction: column;
            padding: env(safe-area-inset-top, 20px) 15px env(safe-area-inset-bottom, 20px) 15px;
        }

        .header { flex-shrink: 0; text-align: center; margin-bottom: 10px; position: relative; }
        .timecode { font-family: monospace; font-size: clamp(34px, 10vw, 48px); font-weight: bold; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .settings-icon { position: absolute; right: 0; top: 0; font-size: 24px; padding: 5px; opacity: 0.7; }

        /* Button Grid */
        .button-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; 
        }
        .main-btn {
            height: 85px; border-radius: 22px; border: none; color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: 700; font-size: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.05s;
        }
        .main-btn:active { transform: scale(0.95); }
        .btn-label { font-size: 10px; opacity: 0.6; text-transform: uppercase; margin-top: 4px; }

        /* Monitor Modus Anpassung */
        body.monitor-on .button-grid {
            grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: auto;
        }
        body.monitor-on .main-btn { height: 60px; font-size: 12px; border-radius: 12px; background: rgba(0,0,0,0.6) !important; border: 1px solid rgba(255,255,255,0.3); }
        body.monitor-on .btn-label { display: none; }
        body.monitor-on .recent-markers { display: none; }

        /* History */
        .recent-markers {
            flex-grow: 1; background: var(--card); border-radius: 20px; 
            padding: 15px; overflow-y: auto; margin-bottom: 15px;
        }
        .marker-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 0; border-bottom: 1px solid #333;
        }
        .m-name { font-weight: 600; }
        .m-time { font-family: monospace; color: #888; font-size: 13px; }

        /* Footer */
        .footer { display: flex; gap: 10px; flex-shrink: 0; }
        .tool-btn { background: var(--card); border: none; color: white; padding: 15px; border-radius: 18px; flex: 1; font-weight: bold; font-size: 14px; }
        .mon-toggle-btn { background: #5856d6; color: white; }
        .export-btn { background: var(--accent); color: black; }

        /* Colors */
        .Red { background: #ff453a; } .Blue { background: #0a84ff; } .Green { background: #32d74b; } .Orange { background: #ff9f0a; }
        .Yellow { background: #ffd60a; color: black; } .Purple { background: #bf5af2; } .Pink { background: #ff375f; } .Cyan { background: #64d2ff; color: black; }

        #settings-modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 100; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content { background: #1c1c1e; padding: 25px; border-radius: 25px; width: 100%; max-width: 400px; }
        input, select { background: #2c2c2e; border: none; padding: 12px; border-radius: 10px; color: white; width: 100%; margin-bottom: 10px; font-size: 16px; }
    </style>
</head>
<body>

    <video id="video-bg" autoplay playsinline muted></video>

    <div class="app-layer">
        <div id="settings-modal">
            <div class="modal-content">
                <h2 style="margin-top:0">Settings</h2>
                <div id="edit-fields"></div>
                <button class="tool-btn export-btn" style="width:100%" onclick="closeSettings()">Speichern</button>
            </div>
        </div>

        <div class="header">
            <div class="settings-icon" onclick="openSettings()">⚙️</div>
            <div class="timecode" id="tc">00:00:00:00</div>
        </div>

        <div class="button-grid" id="main-grid"></div>

        <div class="recent-markers">
            <div id="marker-history"></div>
        </div>

        <div class="footer">
            <button class="tool-btn" onclick="undo()">Undo</button>
            <button class="tool-btn mon-toggle-btn" id="mon-btn" onclick="toggleMonitor()">Monitor An</button>
            <button class="tool-btn export-btn" onclick="exportCSV()">Export</button>
        </div>
    </div>

    <script>
        let markers = JSON.parse(localStorage.getItem('sessionMarkers')) || [];
        let btnConfigs = JSON.parse(localStorage.getItem('btnConfigs')) || [
            { name: 'Reel', color: 'Red' }, { name: 'Thema', color: 'Blue' },
            { name: 'Highlight', color: 'Green' }, { name: 'Cut', color: 'Orange' }
        ];

        function updateTC() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const f = String(Math.floor(now.getMilliseconds() / 40)).padStart(2, '0');
            document.getElementById('tc').innerText = `${h}:${m}:${s}:${f}`;
            requestAnimationFrame(updateTC);
        }

        async function toggleMonitor() {
            const video = document.getElementById('video-bg');
            const btn = document.getElementById('mon-btn');
            
            if (document.body.classList.contains('monitor-on')) {
                document.body.classList.remove('monitor-on');
                video.style.display = 'none';
                btn.innerText = "Monitor An";
                if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            } else {
                try {
                    // Kamera-Zugriff anfordern
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: {涼: "environment"}, width: 1280, height: 720 } 
                    });
                    video.srcObject = stream;
                    video.style.display = 'block';
                    document.body.classList.add('monitor-on');
                    btn.innerText = "Monitor Aus";
                } catch (e) {
                    alert("Kamera-Fehler: Bitte in den Chrome-Einstellungen den Zugriff auf die Kamera erlauben!");
                }
            }
        }

        function renderUI() {
            document.getElementById('main-grid').innerHTML = btnConfigs.map(c => `
                <button class="main-btn ${c.color}" onclick="addMarker('${c.name}', '${c.color}')">
                    ${c.name}<span class="btn-label">Marker</span>
                </button>`).join('');
            
            document.getElementById('marker-history').innerHTML = markers.slice(-10).reverse().map(m => `
                <div class="marker-item"><span class="m-name">${m.name}</span><span class="m-time">${m.time}</span></div>`).join('');
            
            localStorage.setItem('btnConfigs', JSON.stringify(btnConfigs));
            localStorage.setItem('sessionMarkers', JSON.stringify(markers));
        }

        function addMarker(name, color) {
            if (navigator.vibrate) navigator.vibrate(50);
            markers.push({ name, color, time: document.getElementById('tc').innerText });
            renderUI();
        }

        function openSettings() {
            document.getElementById('edit-fields').innerHTML = btnConfigs.map((c, i) => `
                <input type="text" value="${c.name}" onchange="btnConfigs[${i}].name=this.value">
                <select onchange="btnConfigs[${i}].color=this.value">
                    ${['Red','Blue','Green','Yellow','Cyan','Pink','Purple','Orange'].map(col => `<option value="${col}" ${c.color===col?'selected':''}>${col}</option>`).join('')}
                </select>`).join('');
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; renderUI(); }
        function undo() { markers.pop(); renderUI(); }

        async function exportCSV() {
            if(!markers.length) return alert("Keine Marker!");
            let csv = "Name,Notes,Color,Marker Name,Description,Duration,Source Timecode\n";
            markers.forEach(m => csv += `${m.name},,${m.color},${m.name},,00:00:00:00,${m.time}\n`);
            const d = new Date();
            const fileName = `Markers_${d.toISOString().slice(0,10)}.csv`;
            const file = new File([new Blob([csv], { type: 'text/csv' })], fileName, { type: 'text/csv' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file], title: 'Marker Export' });
            } else {
                const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(file), download: fileName });
                a.click();
            }
        }

        updateTC();
        renderUI();
    </script>
</body>
</html>
