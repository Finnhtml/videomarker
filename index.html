<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Marker Pro Monitor</title>
    <style>
        :root { --bg: #000; --card: rgba(28, 28, 30, 0.8); --accent: #32d74b; --text: #fff; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body, html { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; overflow: hidden; }
        
        /* Kamera Hintergrund */
        #video-bg {
            position: fixed; inset: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: -1; display: none; background: #222;
        }

        .container { 
            display: flex; flex-direction: column; height: 100%; 
            padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom);
        }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .timecode { font-family: monospace; font-size: 32px; font-weight: bold; text-shadow: 0 2px 4px #000; }
        
        /* Kompakter Monitor-Modus Style */
        body.monitor-on .button-grid { 
            grid-template-columns: repeat(4, 1fr); 
            position: fixed; bottom: 80px; left: 10px; right: 10px; gap: 5px; 
        }
        body.monitor-on .main-btn { height: 60px; font-size: 12px; border-radius: 12px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); }
        body.monitor-on .recent-markers { display: none; }
        body.monitor-on .timecode { font-size: 24px; position: fixed; top: 10px; left: 15px; }

        .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
        .main-btn {
            height: 80px; border-radius: 20px; border: none; color: white;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
        }

        .recent-markers { flex-grow: 1; background: var(--card); border-radius: 20px; padding: 12px; overflow-y: auto; margin-bottom: 10px; }
        .marker-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #333; font-size: 14px; }

        .footer { display: flex; gap: 8px; padding-bottom: 10px; }
        .tool-btn { background: var(--card); border: none; color: white; padding: 12px; border-radius: 15px; flex: 1; font-weight: bold; }
        .monitor-btn { background: #5856d6; } /* Lila für Monitor Modus */
        
        .Red { background: #ff453a; } .Blue { background: #0a84ff; } .Green { background: #32d74b; } .Orange { background: #ff9f0a; }
    </style>
</head>
<body>

    <video id="video-bg" autoplay playsinline></video>

    <div class="container">
        <div class="header">
            <div class="timecode" id="tc">00:00:00:00</div>
            <div onclick="openSettings()" style="font-size: 24px;">⚙️</div>
        </div>

        <div class="button-grid" id="main-grid"></div>

        <div class="recent-markers" id="history-box">
            <div id="marker-history"></div>
        </div>

        <div class="footer">
            <button class="tool-btn" onclick="undo()">Undo</button>
            <button class="tool-btn monitor-btn" id="mon-toggle" onclick="toggleMonitor()">Monitor An</button>
            <button class="tool-btn" style="background: #32d74b; color: #000;" onclick="exportCSV()">Export</button>
        </div>
    </div>

    <script>
        let markers = JSON.parse(localStorage.getItem('sessionMarkers')) || [];
        let btnConfigs = JSON.parse(localStorage.getItem('btnConfigs')) || [
            { name: 'Reel', color: 'Red' }, { name: 'Thema', color: 'Blue' },
            { name: 'Highlight', color: 'Green' }, { name: 'Cut', color: 'Orange' }
        ];

        function updateTC() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const f = String(Math.floor(now.getMilliseconds() / 40)).padStart(2, '0');
            document.getElementById('tc').innerText = `${h}:${m}:${s}:${f}`;
            requestAnimationFrame(updateTC);
        }

        async function toggleMonitor() {
            const video = document.getElementById('video-bg');
            const btn = document.getElementById('mon-toggle');
            
            if (document.body.classList.contains('monitor-on')) {
                document.body.classList.remove('monitor-on');
                video.style.display = 'none';
                btn.innerText = "Monitor An";
                if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                    video.style.display = 'block';
                    document.body.classList.add('monitor-on');
                    btn.innerText = "Monitor Aus";
                } catch (e) {
                    alert("Kamera nicht gefunden. USB-C Verbindung prüfen!");
                }
            }
        }

        function renderUI() {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = btnConfigs.map(c => `<button class="main-btn ${c.color}" onclick="addMarker('${c.name}', '${c.color}')">${c.name}</button>`).join('');
            const history = document.getElementById('marker-history');
            history.innerHTML = markers.slice(-5).reverse().map(m => `<div class="marker-item"><span>${m.name}</span><span style="color:#888">${m.time}</span></div>`).join('');
            localStorage.setItem('sessionMarkers', JSON.stringify(markers));
        }

        function addMarker(name, color) {
            if (navigator.vibrate) navigator.vibrate(40);
            markers.push({ name, color, time: document.getElementById('tc').innerText });
            renderUI();
        }

        function undo() { markers.pop(); renderUI(); }

        function exportCSV() {
            let csv = "Name,Notes,Color,Marker Name,Description,Duration,Source Timecode\n";
            markers.forEach(m => csv += `${m.name},,${m.color},${m.name},,00:00:00:00,${m.time}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'Markers.csv' });
            a.click();
        }

        updateTC();
        renderUI();
    </script>
</body>
</html>
